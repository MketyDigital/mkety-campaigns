name: Verify MKETY Campaigns deployment and OCI address

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deployment-verify.yml
      - .github/workflows/provision-campaigns.yml
      - Dockerfile
      - src/**
      - scripts/**
      - migrations/**
      - package.json
      - package-lock.json
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL || secrets.COOLIFY_URL || 'https://deploy.mkety.com' }}
      COOLIFY_API_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN || secrets.COOLIFY_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_EMAIL_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_EMAIL_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_EMAIL_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_EMAIL_REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_EMAIL_PRIVATE_KEY }}
    steps:
      - name: Inspect Coolify application and latest deployment
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.MKETY_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = (process.env.COOLIFY_URL || '').trim();
          let origin;
          try { origin = new URL(raw.includes('://') ? raw : 'https://' + (raw.startsWith('//') ? raw.slice(2) : raw)); }
          catch { throw new Error('Coolify URL is invalid.'); }
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.search || origin.hash || (origin.pathname !== '/' && origin.pathname !== '')) throw new Error('Coolify URL must be a safe HTTPS origin.');
          const token = process.env.COOLIFY_API_TOKEN || '';
          if (!token) throw new Error('Coolify API token is missing.');
          const api = origin.origin + '/api/v1';
          const get = async path => {
            const response = await fetch(api + path, { headers: { authorization: 'Bearer ' + token, accept: 'application/json' }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error('Coolify returned HTTP ' + response.status + ' for ' + path + '.');
            return response.json();
          };
          const apps = await get('/applications');
          const normalize = value => {
            let repo = String(value || '').toLowerCase();
            if (repo.startsWith('git@github.com:')) repo = 'github.com/' + repo.slice('git@github.com:'.length);
            if (repo.startsWith('https://')) repo = repo.slice('https://'.length);
            if (repo.startsWith('http://')) repo = repo.slice('http://'.length);
            if (repo.endsWith('.git')) repo = repo.slice(0, -4);
            if (repo.endsWith('/')) repo = repo.slice(0, -1);
            return repo;
          };
          const matches = apps.filter(a => normalize(a.git_repository) === 'github.com/mketydigital/mkety-campaigns' && a.git_branch === 'main' || a.name === 'mkety-campaigns' || String(a.domains || a.fqdn || '').includes('campaign.mkety.com'));
          if (matches.length !== 1) {
            console.log('Campaigns Coolify app matches:', matches.length);
            process.exit(0);
          }
          const app = await get('/applications/' + matches[0].uuid);
          const databaseResources = await get('/databases');
          const databaseMatches = databaseResources.filter(item => item.name === 'mkety-postgres');
          const knownDatabase = databaseMatches.length === 1 ? await get('/databases/' + databaseMatches[0].uuid) : null;
          // Inspect only runtime variable names and safe connection metadata; never log variable values.
          // Use the existing app DB credentials with Coolify's external endpoint for a read-only role/schema check.
          const checkExternalDatabasePrivileges = async () => {
            if (!knownDatabase?.external_db_url || !process.env.DATABASE_URL) {
              console.log('PostgreSQL external-endpoint privilege check: unavailable');
              return;
            }
            const { spawnSync } = await import('node:child_process');
            const configuredUrl = (() => { try { return new URL(process.env.DATABASE_URL); } catch { return null; } })();
            const externalUrl = (() => { try { return new URL(knownDatabase.external_db_url); } catch { return null; } })();
            if (!configuredUrl || !externalUrl) {
              console.log('PostgreSQL external-endpoint privilege check: invalid endpoint metadata');
              return;
            }
            const query = "SELECT current_database() = 'mkety', EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'campaigns'), COALESCE((SELECT has_schema_privilege(current_user, oid, 'USAGE') FROM pg_namespace WHERE nspname = 'campaigns'), false), COALESCE((SELECT has_schema_privilege(current_user, oid, 'CREATE') FROM pg_namespace WHERE nspname = 'campaigns'), false), has_database_privilege(current_user, current_database(), 'CREATE');";
            const result = spawnSync('psql', [
              '--no-psqlrc', '--quiet', '--tuples-only', '--no-align',
              '--field-separator=|', '--set=ON_ERROR_STOP=1', '--command', query
            ], {
              encoding: 'utf8',
              timeout: 12000,
              env: {
                ...process.env,
                PGHOST: externalUrl.hostname,
                PGPORT: externalUrl.port || '5432',
                PGUSER: decodeURIComponent(configuredUrl.username),
                PGPASSWORD: decodeURIComponent(configuredUrl.password),
                PGDATABASE: 'mkety',
                PGSSLMODE: externalUrl.searchParams.get('sslmode') || 'prefer',
                PGCONNECT_TIMEOUT: '8'
              }
            });
            if (!result.error && result.status === 0) {
              const match = String(result.stdout || '').trim().match(/^([tf])\|([tf])\|([tf])\|([tf])\|([tf])$/);
              if (match) {
                console.log('PostgreSQL external-endpoint privilege check:', JSON.stringify({
                  database_is_mkety: match[1] === 't',
                  campaigns_schema_exists: match[2] === 't',
                  schema_usage: match[3] === 't',
                  schema_create: match[4] === 't',
                  database_create: match[5] === 't'
                }));
                return;
              }
              console.log('PostgreSQL external-endpoint privilege check: unrecognized result');
              return;
            }
            const message = String(result.stderr || '').toLowerCase();
            const code = result.error?.code || '';
            const category = /password authentication failed|authentication failed/.test(message) ? 'authentication'
              : /permission denied|must be owner|insufficient privilege/.test(message) ? 'database-permissions'
              : /could not translate host|name or service not known|temporary failure in name resolution/.test(message) ? 'dns-resolution'
              : /connection refused|connection timed out|timeout expired|no route to host|could not connect/.test(message) || code === 'ETIMEDOUT' ? 'network-connectivity'
              : /database .* does not exist/.test(message) ? 'database-not-found'
              : result.error ? (['ENOENT','EACCES','ETIMEDOUT'].includes(code) ? code : 'probe-error')
              : 'other';
            console.log('PostgreSQL external-endpoint privilege check: unavailable; failure_category=' + category);
          };
          await checkExternalDatabasePrivileges();
          const configuredEnvs = await get('/applications/' + app.uuid + '/envs');
          const runtimeEnvs = (Array.isArray(configuredEnvs) ? configuredEnvs : [])
            .filter(item => item && item.is_preview !== true && item.is_runtime !== false);
          const byKey = key => runtimeEnvs.find(item => item.key === key);
          const envValue = key => {
            const item = byKey(key);
            if (!item) return '';
            return (typeof item.real_value === 'string' && item.real_value) ||
              (typeof item.value === 'string' ? item.value : '');
          };
          const databaseEnv = byKey('DATABASE_URL');
          const databaseUrlValue = envValue('DATABASE_URL');
          const configuredDbUrl = (() => { try { return new URL(databaseUrlValue); } catch { return null; } })();
          const dbEndpointFlags = value => {
            if (!configuredDbUrl) return null;
            if (!value) return false;
            try {
              const endpoint = new URL(value);
              return endpoint.hostname.toLowerCase() === configuredDbUrl.hostname.toLowerCase() &&
                (endpoint.port || '5432') === (configuredDbUrl.port || '5432') &&
                decodeURIComponent(endpoint.pathname.slice(1)) === decodeURIComponent(configuredDbUrl.pathname.slice(1));
            } catch { return false; }
          };
          const campaignSchema = envValue('CAMPAIGNS_DB_SCHEMA').trim();
          const requiredRuntimeKeys = [
            'DATABASE_URL', 'BETTER_AUTH_SECRET', 'BETTER_AUTH_URL',
            'MKETY_OPS_AUTH_ISSUER', 'MKETY_OPS_AUTH_CLIENT_ID',
            'MKETY_OPS_ALLOWED_EMAIL', 'MKETY_OPS_AUTH_CALLBACK_URL'
          ];
          const providerKeyGroups = {
            acs_email: ['ACS_EMAIL_CONNECTION_STRING'],
            oci_email_delivery: ['OCI_EMAIL_ENDPOINT', 'OCI_EMAIL_REGION', 'OCI_EMAIL_TENANCY_OCID', 'OCI_EMAIL_USER_OCID', 'OCI_EMAIL_FINGERPRINT', 'OCI_EMAIL_PRIVATE_KEY', 'OCI_EMAIL_COMPARTMENT_OCID'],
            azure_domain_management: ['AZURE_ARM_TENANT_ID', 'AZURE_ARM_CLIENT_ID', 'AZURE_ARM_CLIENT_SECRET', 'AZURE_SUBSCRIPTION_ID', 'AZURE_RESOURCE_GROUP', 'AZURE_EMAIL_SERVICE_NAME', 'AZURE_COMMUNICATION_SERVICE_NAME']
          };
          const providerKeyStatus = Object.fromEntries(Object.entries(providerKeyGroups).map(([name, keys]) => {
            const present = keys.filter(key => Boolean(byKey(key)));
            return [name, { present_count: present.length, expected_count: keys.length, missing_keys: keys.filter(key => !byKey(key)) }];
          }));
          console.log('Campaigns Coolify runtime environment check:', JSON.stringify({
            runtime_variable_count: runtimeEnvs.length,
            required_keys_present: Object.fromEntries(requiredRuntimeKeys.map(key => [key, Boolean(byKey(key))])),
            database_url_value_available_from_api: Boolean(databaseUrlValue),
            database_url_is_shown_once: databaseEnv?.is_shown_once === true,
            database_url_is_locked: databaseEnv?.is_locked === true,
            database_target_is_mkety: configuredDbUrl ? decodeURIComponent(configuredDbUrl.pathname.slice(1)) === 'mkety' : null,
            database_url_matches_internal_endpoint: dbEndpointFlags(knownDatabase?.internal_db_url),
            database_url_matches_external_endpoint: dbEndpointFlags(knownDatabase?.external_db_url),
            database_resource_match_count: databaseMatches.length,
            campaign_schema_is_expected: !campaignSchema || campaignSchema === 'campaigns',
            email_provider_is_acs: envValue('EMAIL_PROVIDER') === 'acs-email',
            provider_key_status: providerKeyStatus
          }));
          if (databaseMatches.length === 1) {
            const database = knownDatabase;
            let configuredDatabaseUrl;
            try { configuredDatabaseUrl = new URL(process.env.DATABASE_URL || ''); } catch { configuredDatabaseUrl = null; }
            const sameEndpoint = value => {
              if (!configuredDatabaseUrl || !value) return false;
              try {
                const endpoint = new URL(value);
                return endpoint.hostname.toLowerCase() === configuredDatabaseUrl.hostname.toLowerCase() &&
                  (endpoint.port || '5432') === (configuredDatabaseUrl.port || '5432') &&
                  decodeURIComponent(endpoint.pathname.slice(1)) === decodeURIComponent(configuredDatabaseUrl.pathname.slice(1));
              } catch { return false; }
            };
            console.log('Coolify database endpoint classification:', JSON.stringify({ resource_status: String(database.status || 'unknown').slice(0, 40), target_database_is_mkety: Boolean(configuredDatabaseUrl && decodeURIComponent(configuredDatabaseUrl.pathname.slice(1)) === 'mkety'), matches_internal_endpoint: sameEndpoint(database.internal_db_url), matches_external_endpoint: sameEndpoint(database.external_db_url) }));
          } else console.log('Coolify database endpoint classification: resource match count=' + databaseMatches.length);
          const safeDomains = value => String(value || '').split(',').map(item => item.trim()).filter(Boolean).map(item => {
            try { const url = new URL(item.includes('://') ? item : 'https://' + item); return { host: url.hostname, scheme: url.protocol.replace(':','') }; }
            catch { return { host: 'invalid', scheme: 'unknown' }; }
          });
          const safePath = value => /^[A-Za-z0-9/_-]{1,120}$/.test(String(value || '')) ? String(value) : 'unknown';
          const safePort = value => /^[0-9]{1,5}$/.test(String(value || '')) ? Number(value) : null;
          console.log('Campaigns app metadata:', JSON.stringify({ name: app.name, uuid: app.uuid, domains: safeDomains(app.domains || app.fqdn), status: app.status, health_check_enabled: app.health_check_enabled, health_check_path: safePath(app.health_check_path), health_check_port: safePort(app.health_check_port), health_check_start_period: app.health_check_start_period ?? null, health_check_interval: app.health_check_interval ?? null, health_check_timeout: app.health_check_timeout ?? null, health_check_retries: app.health_check_retries ?? null, health_check_scheme: ['http','https'].includes(app.health_check_scheme) ? app.health_check_scheme : 'unknown', exposed_ports: String(app.ports_exposes || '').split(',').map(value => safePort(value)).filter(value => value !== null), build_pack: app.build_pack, base_directory: app.base_directory, dockerfile_location: app.dockerfile_location, git_branch: app.git_branch, git_commit_sha: app.git_commit_sha, start_command_configured: Boolean(app.start_command || app.command), build_command_configured: Boolean(app.build_command), install_command_configured: Boolean(app.install_command) }));
          const websiteCandidates = apps.filter(item => item.uuid !== app.uuid && String(item.domains || item.fqdn || '').trim());
          const websiteDetails = await Promise.all(websiteCandidates.slice(0, 25).map(async item => {
            try {
              const detail = await get('/applications/' + item.uuid);
              return {
                name: String(detail.name || item.name || 'unknown').slice(0, 80),
                uuid: String(detail.uuid || item.uuid || '').slice(0, 40),
                domains: safeDomains(detail.domains || detail.fqdn),
                status: String(detail.status || 'unknown').slice(0, 40),
                build_pack: ['dockerfile','nixpacks','railpack','static','dockercompose'].includes(detail.build_pack) ? detail.build_pack : 'unknown',
                exposed_ports: String(detail.ports_exposes || '').split(',').map(value => safePort(value)).filter(value => value !== null),
                health_check_enabled: detail.health_check_enabled === true,
                health_check_path: safePath(detail.health_check_path),
                health_check_port: safePort(detail.health_check_port),
                health_check_scheme: ['http','https'].includes(detail.health_check_scheme) ? detail.health_check_scheme : 'unknown'
              };
            } catch { return { name: String(item.name || 'unknown').slice(0, 80), detail: 'unavailable' }; }
          }));
          console.log('Coolify website app comparison:', JSON.stringify({ apps_with_domains: websiteCandidates.length, scanned: websiteDetails.length, omitted: Math.max(0, websiteCandidates.length - websiteDetails.length), other_apps: websiteDetails }));
          // Read-only TLS diagnostic: connect to the Coolify server directly without exposing its address.
          const servers = await get('/servers');
          if (servers.length === 1 && servers[0]?.uuid) {
            const server = await get('/servers/' + servers[0].uuid);
            const proxy = await get('/servers/' + server.uuid + '/proxy');
            const configuration = String(proxy.configuration || '');
            const challengeMode = /dnschallenge/i.test(configuration) ? 'dns' : /httpchallenge/i.test(configuration) ? 'http' : 'unknown';
            const addressKind = (await import('node:net')).isIP(server.ip || '') === 4 ? 'ipv4' : (await import('node:net')).isIP(server.ip || '') === 6 ? 'ipv6' : 'hostname';
            console.log('Coolify origin proxy:', JSON.stringify({ proxy_type: ['TRAEFIK','CADDY'].includes(proxy.proxy_type) ? proxy.proxy_type : 'unknown', proxy_status: ['running','stopped','starting','error'].includes(proxy.status) ? proxy.status : 'unknown', resolver_configured: Boolean(proxy.traefik_certificate_resolver), challenge_mode: challengeMode, address_kind: addressKind }));
            try {
              const integrationTokens = await get('/security/integration-tokens');
              const cloudflareTokens = integrationTokens.filter(item => item.provider === 'cloudflare');
              console.log('Coolify Cloudflare DNS integration:', JSON.stringify({ configured: cloudflareTokens.length > 0, integrations: cloudflareTokens.map(item => ({ dns_capability: Array.isArray(item.capabilities) && item.capabilities.includes('dns'), dns_zones_count: Number.isInteger(item.dns_zones_count) ? item.dns_zones_count : null, automatic_dns: item.automatic_dns === true })) }));
            } catch { console.log('Coolify Cloudflare DNS integration: unavailable'); }
            if (server.ip) {
              const dns = await import('node:dns/promises');
              const resolved = await dns.lookup('campaign.mkety.com', { all: true }).catch(() => []);
              const ipv4 = resolved.filter(item => item.family === 4);
              const ipv6 = resolved.filter(item => item.family === 6);
              console.log('Campaigns DNS A record check:', JSON.stringify({ matchesExpectedOrigin: ipv4.some(item => item.address === '89.168.70.209'), ipv4_count: ipv4.length, ipv6_count: ipv6.length }));
              const tls = await import('node:tls');
              const result = await new Promise(resolve => {
                const socket = tls.connect({ host: '89.168.70.209', port: 443, servername: 'campaign.mkety.com', rejectUnauthorized: false, timeout: 8000 }, () => {
                  const cert = socket.getPeerCertificate();
                  resolve({ authorized: socket.authorized, authorization_error: socket.authorizationError || '', subject_cn: cert.subject?.CN || '', issuer_cn: cert.issuer?.CN || '', valid_from: cert.valid_from || '', valid_to: cert.valid_to || '', san_matches_campaign: String(cert.subjectaltname || '').includes('campaign.mkety.com') });
                  socket.destroy();
                });
                socket.on('error', error => {
                  const code = String(error.code || error.name || 'unknown');
                  resolve({ connection_error: /^[A-Z0-9_]{1,40}$/.test(code) ? code : 'unclassified' });
                });
                socket.on('timeout', () => { socket.destroy(); resolve({ connection_error: 'ETIMEDOUT' }); });
              });
              console.log('Direct Coolify origin TLS certificate:', JSON.stringify(result));
              const valid = result.authorized === true && result.san_matches_campaign === true;
              const safeIssuer = String(result.issuer_cn || 'unknown').replace(/[^A-Za-z0-9 ._-]/g, '').slice(0, 28);
              const description = result.connection_error
                ? 'origin TLS probe unavailable: ' + result.connection_error
                : 'origin TLS ' + (valid ? 'valid' : 'invalid') + '; hostname=' + (result.san_matches_campaign ? 'match' : 'mismatch') + '; issuer=' + safeIssuer;
              try {
                const statusResponse = await fetch('https://api.github.com/repos/MketyDigital/mkety-campaigns/statuses/' + process.env.GITHUB_SHA, {
                  method: 'POST',
                  headers: { authorization: 'Bearer ' + process.env.GITHUB_TOKEN, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'x-github-api-version': '2022-11-28' },
                  body: JSON.stringify({ state: valid ? 'success' : 'failure', context: 'campaign-origin-tls', description: description.slice(0, 140), target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID })
                });
                console.log('Origin TLS status publication:', statusResponse.ok ? 'published' : 'unavailable HTTP ' + statusResponse.status);
              } catch { console.log('Origin TLS status publication: unavailable'); }
            } else console.log('Direct Coolify origin TLS probe unavailable: server IP metadata missing.');
          } else console.log('Direct Coolify origin TLS probe unavailable: server count was not one.');
          // Confirm the HTTP-01 entry point is publicly reachable before requesting a new certificate.
          try {
            const response = await fetch('http://campaign.mkety.com/', { redirect: 'manual', signal: AbortSignal.timeout(8000) });
            const location = response.headers.get('location') || '';
            const redirectToHttps = /^https:\/\//i.test(location);
            console.log('Public HTTP port 80 probe: HTTP ' + response.status + '; redirect_to_https=' + redirectToHttps);
          } catch (error) {
            const code = error?.cause?.code || error?.code || '';
            const allowed = new Set(['ENOTFOUND','EAI_AGAIN','ECONNREFUSED','ECONNRESET','ETIMEDOUT','EHOSTUNREACH','UND_ERR_CONNECT_TIMEOUT']);
            console.log('Public HTTP port 80 probe unavailable; network=' + (allowed.has(code) ? code : 'unclassified'));
          }
          // Public, read-only probes distinguish DNS/TLS/listener failures from a database readiness failure.
          for (const path of ['/healthz', '/readyz']) {
            try {
              const response = await fetch('https://campaign.mkety.com' + path, {
                redirect: 'error',
                signal: AbortSignal.timeout(8000),
                headers: { accept: 'application/json' },
              });
              const body = await response.json().catch(() => null);
              const appStatus = body && ['ok', 'ready', 'not_ready'].includes(body.status) ? body.status : 'unrecognized';
              console.log('Public health probe ' + path + ': HTTP ' + response.status + '; app_status=' + appStatus);
            } catch (error) {
              const code = error?.cause?.code || error?.code || '';
              const allowed = new Set(['ENOTFOUND', 'EAI_AGAIN', 'ECONNREFUSED', 'ECONNRESET', 'ETIMEDOUT', 'CERT_HAS_EXPIRED', 'DEPTH_ZERO_SELF_SIGNED_CERT', 'ERR_TLS_CERT_ALTNAME_INVALID', 'UND_ERR_CONNECT_TIMEOUT']);
              console.log('Public health probe ' + path + ' unavailable; network_or_tls=' + (allowed.has(code) ? code : 'unclassified'));
            }
          }
          // Temporary diagnostic: TLS is already measured separately; bypass certificate validation only for this read-only readiness probe.
          const { request: httpsRequest } = await import('node:https');
          const directReadyProbe = await new Promise(resolve => {
            const request = httpsRequest({
              hostname: '89.168.70.209',
              port: 443,
              path: '/readyz',
              method: 'GET',
              servername: 'campaign.mkety.com',
              rejectUnauthorized: false,
              headers: { host: 'campaign.mkety.com', accept: 'application/json' }
            }, response => {
              let body = '';
              response.setEncoding('utf8');
              response.on('data', chunk => { if (body.length < 2048) body += chunk; });
              response.on('end', () => {
                let appStatus = 'unrecognized';
                try {
                  const value = JSON.parse(body);
                  if (value && ['ready', 'not_ready'].includes(value.status)) appStatus = value.status;
                } catch {}
                resolve({ http_status: response.statusCode || 0, app_status: appStatus });
              });
            });
            request.on('error', error => {
              const code = String(error?.cause?.code || error?.code || '');
              const allowed = new Set(['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','EHOSTUNREACH','UND_ERR_CONNECT_TIMEOUT']);
              resolve({ http_status: null, app_status: 'unavailable', network_code: allowed.has(code) ? code : 'unclassified' });
            });
            request.setTimeout(7000, () => request.destroy(new Error('diagnostic timeout')));
            request.end();
          });
          console.log('Campaigns direct readiness diagnostic probe:', JSON.stringify(directReadyProbe));
          const deployments = await get('/deployments/applications/' + app.uuid);
          const list = Array.isArray(deployments) ? deployments : (deployments.deployments || []);
          const recent = list.slice(0, 3).map(item => ({ status: item.status, created_at: item.created_at, deployment_uuid: item.deployment_uuid }));
          console.log('Recent deployment states:', JSON.stringify(recent));
          const failed = recent.find(item => item.status === 'failed' && item.deployment_uuid);
          if (failed) {
            const detail = await get('/deployments/' + failed.deployment_uuid);
            const logs = String(detail.logs || '');
            const categories = [];
            if (/ECONNREFUSED|connection refused|could not connect|ETIMEDOUT|connect timeout|ENOTFOUND|ECONNRESET/i.test(logs)) categories.push('database-or-service-connection');
            if (/28P01|password authentication failed|database authentication failed/i.test(logs)) categories.push('database-authentication');
            if (/3D000|database .{0,60} does not exist/i.test(logs)) categories.push('database-not-found');
            if (/42501|permission denied.{0,80}schema|insufficient privilege/i.test(logs)) categories.push('database-permissions');
            if (/migration.{0,100}(failed|error|exception)|(?:failed|error|exception).{0,100}migration/i.test(logs)) categories.push('migration-failure');
            if (/(BETTER_AUTH_SECRET|MKETY_OPS_AUTH_ISSUER|ZITADEL|OIDC).{0,100}(missing|invalid|required|must|error|failed|mismatch)/i.test(logs)) categories.push('authentication-configuration-failure');
            if (/failed to read Dockerfile|Dockerfile.{0,80}(not found|does not exist)|failed to send context/i.test(logs)) categories.push('dockerfile-or-build-context');
            if (/out of memory|oom.?killed|exit code 137/i.test(logs)) categories.push('build-memory-limit');
            if (/npm (?:ERR!|error) code E[A-Z0-9]+/i.test(logs)) categories.push('dependency-installation-failure');
            if (/error TS\d{4,5}/.test(logs)) categories.push('typescript-build-failure');
            if (/failed to solve|failed to build|npm (?:ERR!|error)|executor failed|error during (?:image )?build/i.test(logs)) categories.push('image-build-failure');
            if (/(health.?check|readyz).{0,100}(failed|unhealthy|timeout|error)|EADDRINUSE/i.test(logs)) categories.push('health-or-port-failure');
            if (categories.length === 0 && /\b(?:Error:|ERR_[A-Z]+|fatal exception)\b/i.test(logs)) categories.push('runtime-startup-error');
            if (categories.length === 0 && /error|failed|fatal|exception/i.test(logs)) categories.push('unclassified-deployment-error');
            const sqlstates = [...new Set([...logs.matchAll(/\bSQLSTATE\s*[:=]?\s*([0-9A-Z]{5})\b/g)].map(match => match[1]))];
            const knownNpmCodes = new Set(['EAI_AGAIN','ECONNREFUSED','ECONNRESET','EEXIST','EINTEGRITY','EINVAL','EISDIR','ENOENT','ENOTFOUND','EACCES','EPERM','E401','E403','E404','ETIMEDOUT','ERESOLVE','EBADENGINE']);
            const npmCodes = [...new Set([...logs.matchAll(/npm (?:ERR!|error) code ([A-Z0-9_]{3,16})/gi)].map(match => match[1].toUpperCase()).filter(code => knownNpmCodes.has(code)))];
            const typescriptCodes = [...new Set([...logs.matchAll(/error TS(\d{4,5})/g)].map(match => 'TS' + match[1]))];
            const diagnosticLogs = logs.replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '').replace(/\u0000/g, '');
            const knownStartupCodes = new Set(['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','EHOSTUNREACH','EADDRNOTAVAIL','EPIPE','EACCES','EPERM','UNABLE_TO_VERIFY_LEAF_SIGNATURE','SELF_SIGNED_CERT_IN_CHAIN','DEPTH_ZERO_SELF_SIGNED_CERT','CERT_HAS_EXPIRED','ERR_TLS_CERT_ALTNAME_INVALID']);
            const startupCodes = [...new Set([...diagnosticLogs.matchAll(/\b([A-Z][A-Z0-9_]{2,45})\b/g)].map(match => match[1]).filter(code => knownStartupCodes.has(code)))];
            const connectionCause = /ECONNREFUSED|connection refused/i.test(diagnosticLogs) ? 'connection-refused'
              : /ENOTFOUND|getaddrinfo|name.{0,20}resolution/i.test(diagnosticLogs) ? 'name-resolution'
              : /ETIMEDOUT|connect timeout|timeout expired/i.test(diagnosticLogs) ? 'connection-timeout'
              : /ECONNRESET|connection reset/i.test(diagnosticLogs) ? 'connection-reset'
              : /could not connect/i.test(diagnosticLogs) ? 'connect-error'
              : /28P01|password authentication failed/i.test(diagnosticLogs) ? 'database-authentication'
              : /42501|permission denied.{0,80}schema|insufficient privilege/i.test(diagnosticLogs) ? 'database-permissions'
              : /UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN|DEPTH_ZERO_SELF_SIGNED_CERT/i.test(diagnosticLogs) ? 'tls-certificate'
              : null;
            const deployedCommit = /^[0-9a-f]{7,40}$/i.test(String(detail.commit || '')) ? String(detail.commit).slice(0, 12) : null;
            console.log('Coolify failed deployment summary:', JSON.stringify({
              status: String(detail.status || 'unknown').slice(0, 40),
              source_commit: deployedCommit,
              migration_diagnostic_marker_seen: /Campaigns PostgreSQL migration failed:/.test(diagnosticLogs),
              application_listening_marker_seen: /MKETY Campaigns listening on http/i.test(diagnosticLogs),
              log_line_count: diagnosticLogs.split(String.fromCharCode(10)).filter(Boolean).length
            }));
            const migrationFailures = [...diagnosticLogs.matchAll(/Campaigns PostgreSQL migration failed:\s*(\{[^\r\n]{1,500}\})/g)]
              .flatMap(match => {
                try {
                  const value = JSON.parse(match[1]);
                  const phase = typeof value.phase === 'string' && /^[A-Za-z0-9 ._-]{1,120}$/.test(value.phase) ? value.phase : 'unknown';
                  const errorType = typeof value.errorType === 'string' && /^[A-Za-z0-9]{1,40}$/.test(value.errorType) ? value.errorType : 'unknown';
                  const errorCode = typeof value.errorCode === 'string' && /^[A-Z0-9_]{2,32}$/.test(value.errorCode) ? value.errorCode : 'unclassified';
                  return [{ phase, errorType, errorCode }];
                } catch { return []; }
              });
            if (migrationFailures.length === 0 && /Campaigns PostgreSQL migration failed:/.test(diagnosticLogs)) {
              const phase = diagnosticLogs.match(/phase[^A-Za-z0-9]+([A-Za-z0-9 ._-]{1,120})/)?.[1]?.trim();
              const errorType = diagnosticLogs.match(/errorType[^A-Za-z0-9]+([A-Za-z0-9]{1,40})/)?.[1];
              const errorCode = diagnosticLogs.match(/errorCode[^A-Za-z0-9]+([A-Z0-9_]{2,32})/)?.[1];
              migrationFailures.push({
                phase: phase || 'unknown',
                errorType: errorType || 'unknown',
                errorCode: errorCode || 'unclassified'
              });
            }
            const unresolvedImports = [...new Set([...diagnosticLogs.matchAll(/Cannot find module\s+(['"])([^'"]{1,180})\1/gi)].map(match => /^[A-Za-z0-9@._:/-]+$/.test(match[2]) ? match[2] : '[nonstandard module specifier]'))];
            const typescriptLocations = [...new Set([...diagnosticLogs.matchAll(/([A-Za-z0-9_./-]+\.tsx?)\((\d{1,6}),\d+\):\s*error TS2307/g)].map(match => match[1].split('/').pop() + ':' + match[2]))];
            console.log('Deployment diagnostic categories:', JSON.stringify(categories));
            if (startupCodes.length) console.log('Sanitized database/runtime error codes:', JSON.stringify(startupCodes));
            if (!migrationFailures.length && (categories.length || startupCodes.length || sqlstates.length)) {
              const targetSha = /^[0-9a-f]{40}$/i.test(String(detail.commit || '')) ? String(detail.commit) : '';
              const category = categories.slice(0, 2).join(',') || 'unclassified';
              const cause = connectionCause || startupCodes[0] || sqlstates[0] || 'unclassified';
              const listening = /MKETY Campaigns listening on http/i.test(diagnosticLogs) ? 'yes' : 'no';
              const description = ('Startup diagnostic: category=' + category + '; cause=' + cause + '; listening=' + listening).slice(0, 140);
              if (targetSha) {
                const statusResponse = await fetch('https://api.github.com/repos/MketyDigital/mkety-campaigns/statuses/' + targetSha, {
                  method: 'POST',
                  headers: {
                    authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                    accept: 'application/vnd.github+json',
                    'content-type': 'application/json',
                    'x-github-api-version': '2022-11-28'
                  },
                  body: JSON.stringify({
                    state: 'success',
                    context: 'campaigns/startup-diagnostic',
                    description,
                    target_url: 'https://github.com/MketyDigital/mkety-campaigns/actions/runs/' + process.env.GITHUB_RUN_ID
                  }),
                  signal: AbortSignal.timeout(15000)
                });
                console.log(statusResponse.ok ? 'Sanitized startup diagnostic status published.' : 'Sanitized startup diagnostic status unavailable; HTTP ' + statusResponse.status + '.');
              }
            }
            if (sqlstates.length) console.log('PostgreSQL SQLSTATE codes:', JSON.stringify(sqlstates));
            if (migrationFailures.length) {
              const diagnostic = migrationFailures[0];
              const targetSha = /^[0-9a-f]{40}$/i.test(String(detail.commit || '')) ? String(detail.commit) : '';
              const phaseMatch = diagnosticLogs.match(/phase\\?["']?\s*[:=]\s*\\?["']?([A-Za-z0-9 ._-]{1,120}?)(?=\\?["']?\s*[,}]|\s+(?:errorType|errorCode))/);
              const phase = phaseMatch?.[1]?.trim() || 'unclassified';
              let databaseTlsMode = 'unavailable';
              try {
                const databaseUrl = new URL(process.env.DATABASE_URL || '');
                const sslmode = databaseUrl.searchParams.get('sslmode');
                databaseTlsMode = sslmode && /^(disable|allow|prefer|require|verify-ca|verify-full)$/.test(sslmode)
                  ? sslmode
                  : databaseUrl.searchParams.get('ssl') === 'true' ? 'ssl=true'
                  : databaseUrl.searchParams.has('sslrootcert') ? 'sslrootcert=present'
                  : 'driver-default';
              } catch {}
              const description = ('Startup diagnostic: phase=' + phase + '; type=' + diagnostic.errorType + '; code=' + diagnostic.errorCode + '; db_tls=' + databaseTlsMode).slice(0, 140);
              if (targetSha) {
                const statusResponse = await fetch('https://api.github.com/repos/MketyDigital/mkety-campaigns/statuses/' + targetSha, {
                  method: 'POST',
                  headers: {
                    authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                    accept: 'application/vnd.github+json',
                    'content-type': 'application/json',
                    'x-github-api-version': '2022-11-28'
                  },
                  body: JSON.stringify({
                    state: 'success',
                    context: 'campaigns/startup-diagnostic',
                    description,
                    target_url: 'https://github.com/MketyDigital/mkety-campaigns/actions/runs/' + process.env.GITHUB_RUN_ID
                  }),
                  signal: AbortSignal.timeout(15000)
                });
                console.log(statusResponse.ok ? 'Sanitized startup diagnostic status published.' : 'Sanitized startup diagnostic status unavailable; HTTP ' + statusResponse.status + '.');
              } else {
                console.log('Sanitized startup diagnostic status unavailable; failed deployment commit was not a full SHA.');
              }
            }
            if (npmCodes.length) console.log('npm error codes:', JSON.stringify(npmCodes));
            if (typescriptCodes.length) console.log('TypeScript error codes:', JSON.stringify(typescriptCodes));
            if (unresolvedImports.length) console.log('TypeScript unresolved module specifiers:', JSON.stringify(unresolvedImports));
            if (typescriptLocations.length) console.log('TypeScript TS2307 source locations:', JSON.stringify(typescriptLocations));
            if (categories.length === 0 && sqlstates.length === 0 && npmCodes.length === 0 && typescriptCodes.length === 0) console.log('Coolify deployment logs contained no recognized diagnostic pattern.');
          }
          try {
            const runtimeResponse = await fetch(api + '/applications/' + app.uuid + '/logs?lines=100', {
              headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
              signal: AbortSignal.timeout(15000)
            });
            const runtimeContentType = runtimeResponse.headers.get('content-type') || 'unknown';
            const runtimeBody = await runtimeResponse.text();
            if (!runtimeResponse.ok) {
              const errorText = runtimeBody.toLowerCase();
              const errorCategory = /not running|no container|container.{0,40}(not found|missing|unavailable)/.test(errorText) ? 'container-unavailable' : /unauthori[sz]ed|permission|forbidden/.test(errorText) ? 'permission' : /invalid|parameter|query|validation/.test(errorText) ? 'request-validation' : 'other';
              console.log('Runtime log endpoint response:', JSON.stringify({ http_status: runtimeResponse.status, content_type: runtimeContentType, body_bytes: Buffer.byteLength(runtimeBody), api_error_category: errorCategory }));
            } else {
              let runtimePayload;
              try { runtimePayload = JSON.parse(runtimeBody); }
              catch { runtimePayload = null; }
              const runtimeLogs = typeof runtimePayload?.logs === 'string' ? runtimePayload.logs : '';
              const readinessFailures = [...runtimeLogs.matchAll(/Campaigns database connection failed:\s*(\{[^\r\n]{1,240}\})/g)]
                .flatMap(match => {
                  try {
                    const value = JSON.parse(match[1]);
                    const errorType = typeof value.errorType === 'string' && /^[A-Za-z0-9]{1,40}$/.test(value.errorType) ? value.errorType : 'unclassified';
                    const knownCodes = new Set(['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','EHOSTUNREACH','EADDRNOTAVAIL','EPIPE','UNABLE_TO_VERIFY_LEAF_SIGNATURE','SELF_SIGNED_CERT_IN_CHAIN','DEPTH_ZERO_SELF_SIGNED_CERT','CERT_HAS_EXPIRED','ERR_TLS_CERT_ALTNAME_INVALID','28P01','3D000','42501']);
                    const errorCode = typeof value.errorCode === 'string' && knownCodes.has(value.errorCode) ? value.errorCode : 'unclassified';
                    return [{ errorType, errorCode }];
                  } catch { return []; }
                });
              if (readinessFailures.length) console.log('Sanitized runtime readiness errors:', JSON.stringify(readinessFailures));
              const runtimeCategories = [];
              if (/28P01|password authentication failed|database authentication failed/i.test(runtimeLogs)) runtimeCategories.push('database-authentication');
              if (/ECONNREFUSED|connect timeout|ETIMEDOUT|ENOTFOUND|ECONNRESET|could not connect/i.test(runtimeLogs)) runtimeCategories.push('database-or-service-connectivity');
              if (/migration.{0,100}(failed|error|exception)|(?:failed|error|exception).{0,100}migration/i.test(runtimeLogs)) runtimeCategories.push('migration-failure');
              if (/(BETTER_AUTH_SECRET|MKETY_OPS_AUTH_ISSUER|ZITADEL|OIDC).{0,100}(missing|invalid|required|must|error|failed|mismatch)/i.test(runtimeLogs)) runtimeCategories.push('authentication-configuration');
              if (/EADDRINUSE|listen EACCES|port.{0,40}(in use|unavailable|failed)/i.test(runtimeLogs)) runtimeCategories.push('port-binding');
              if (/uncaught exception|unhandled rejection|fatal error|process exited/i.test(runtimeLogs)) runtimeCategories.push('runtime-exception');
              console.log('Sanitized runtime log summary:', JSON.stringify({ categories: runtimeCategories, listening_seen: /listening|server started/i.test(runtimeLogs), logs_field_present: typeof runtimePayload?.logs === 'string', lines: runtimeLogs.split(String.fromCharCode(10)).filter(Boolean).length, content_type: runtimeContentType }));
            }
          } catch (error) {
            const code = String(error?.cause?.code || error?.code || 'unknown');
            const safeCode = ['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_SOCKET'].includes(code) ? code : 'unclassified';
            const errorType = ['TypeError','SyntaxError','AbortError','Error'].includes(error?.name) ? error.name : 'unclassified';
            console.log('Runtime log endpoint request failed:', JSON.stringify({ error_type: errorType, network_code: safeCode }));
          }
          // Database container logs can reveal rejected app connections without exposing log text.
          if (knownDatabase?.uuid) {
            try {
              const response = await fetch(api + '/databases/' + knownDatabase.uuid + '/logs?lines=100', {
                headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
                signal: AbortSignal.timeout(15000)
              });
              const body = await response.text();
              if (response.ok) {
                let payload;
                try { payload = JSON.parse(body); } catch { payload = null; }
                const databaseLogs = typeof payload?.logs === 'string' ? payload.logs : '';
                const categories = [];
                if (/28P01|password authentication failed|database authentication failed/i.test(databaseLogs)) categories.push('authentication');
                if (/3D000|database .{0,60} does not exist/i.test(databaseLogs)) categories.push('database-not-found');
                if (/no pg_hba.conf entry|too many connections|remaining connection slots/i.test(databaseLogs)) categories.push('connection-policy-or-capacity');
                if (/42501|permission denied.{0,80}schema|insufficient privilege/i.test(databaseLogs)) categories.push('database-permissions');
                console.log('Sanitized mkety-postgres log summary:', JSON.stringify({
                  lines: databaseLogs.split(String.fromCharCode(10)).filter(Boolean).length,
                  categories,
                  logs_field_present: typeof payload?.logs === 'string'
                }));
              } else {
                const message = body.toLowerCase();
                const category = /unauthori[sz]ed|forbidden|permission/.test(message) ? 'permission'
                  : /not running|no container|container.{0,40}(not found|missing|unavailable)/.test(message) ? 'container-unavailable'
                  : 'other';
                console.log('mkety-postgres log endpoint response:', JSON.stringify({ http_status: response.status, api_error_category: category }));
              }
            } catch (error) {
              const code = String(error?.cause?.code || error?.code || 'unknown');
              const safeCode = ['ECONNREFUSED','ECONNRESET','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_SOCKET'].includes(code) ? code : 'unclassified';
              console.log('mkety-postgres log endpoint request failed:', safeCode);
            }
          }
          NODE

      - name: Check shared PostgreSQL connectivity and schema privileges
        continue-on-error: true
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.MKETY_DATABASE_URL }}
          PGCONNECT_TIMEOUT: 8
        run: |
          set -uo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "PostgreSQL probe unavailable: database secret missing"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "PostgreSQL probe unavailable: psql client missing"
            exit 0
          fi
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          query="SELECT current_database() = 'mkety', EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'campaigns'), COALESCE((SELECT has_schema_privilege(current_user, oid, 'USAGE') FROM pg_namespace WHERE nspname = 'campaigns'), false), COALESCE((SELECT has_schema_privilege(current_user, oid, 'CREATE') FROM pg_namespace WHERE nspname = 'campaigns'), false), has_database_privilege(current_user, current_database(), 'CREATE');"
          if result="$(psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --field-separator='|' --set=ON_ERROR_STOP=1 --command "$query" 2>"$error_file")"; then
            if [[ "$result" =~ ^[tf][|][tf][|][tf][|][tf][|][tf]$ ]]; then
              IFS='|' read -r database_ok schema_exists schema_usage schema_create database_create <<<"$result"
              echo "PostgreSQL target and privilege check: {\"database_is_mkety\":$database_ok,\"campaigns_schema_exists\":$schema_exists,\"schema_usage\":$schema_usage,\"schema_create\":$schema_create,\"database_create\":$database_create}"
            else
              echo "PostgreSQL probe completed with an unrecognized result shape"
            fi
          else
            if grep -Eqi 'password authentication failed|authentication failed' "$error_file"; then category="authentication"
            elif grep -Eqi 'could not translate host|name or service not known|temporary failure in name resolution' "$error_file"; then category="dns-resolution"
            elif grep -Eqi 'connection refused|connection timed out|timeout expired|no route to host|could not connect' "$error_file"; then category="network-connectivity"
            elif grep -Eqi 'permission denied|must be owner|not authorized|insufficient privilege' "$error_file"; then category="database-permissions"
            else category="other"; fi
            echo "PostgreSQL probe unavailable; failure_category=$category"
          fi

      - name: Resolve manual DNS target through read-only OCI compute inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet oci
          python - <<'PY'
          import json, os
          stage = "SDK import"
          try:
              import oci
              stage = "signing key parse"
              cfg = {
                  "user": os.environ["OCI_USER_OCID"],
                  "fingerprint": os.environ["OCI_FINGERPRINT"],
                  "tenancy": os.environ["OCI_TENANCY_OCID"],
                  "region": os.environ["OCI_REGION"],
                  "key_content": os.environ["OCI_PRIVATE_KEY"],
              }
              oci.signer.load_private_key(cfg["key_content"], None)
              stage = "compute-client-construction"
              compute = oci.core.ComputeClient(cfg)
              network = oci.core.VirtualNetworkClient(cfg)
              stage = "instance-list-request"
              instances = oci.pagination.list_call_get_all_results(
                  compute.list_instances,
                  compartment_id=cfg["tenancy"],
                  compartment_id_in_subtree=True,
                  lifecycle_state="RUNNING",
              ).data
              addresses = []
              stage = "VNIC-attachment-list"
              for instance in instances:
                  stage = "VNIC-attachment-list"
                  attachments = oci.pagination.list_call_get_all_results(
                      compute.list_vnic_attachments,
                      compartment_id=instance.compartment_id,
                      instance_id=instance.id,
                  ).data
                  for attachment in attachments:
                      if not attachment.vnic_id:
                          continue
                      stage = "VNIC-detail-request"
                      vnic = network.get_vnic(attachment.vnic_id).data
                      if vnic.public_ip:
                          addresses.append({"instance": instance.display_name, "public_ipv4": vnic.public_ip})
              if addresses:
                  print("OCI public IPv4 DNS candidates (confirm which instance is the Coolify host before adding DNS):", json.dumps(addresses))
              else:
                  print("OCI compute inventory returned no public IPv4 DNS candidates for running instances.")
          except Exception as exc:
              code = getattr(exc, "status", None) or getattr(exc, "code", None) or type(exc).__name__
              print("OCI compute address lookup unavailable at " + stage + "; permission/network/status:", str(code))
          PY
