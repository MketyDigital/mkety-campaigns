name: Verify MKETY Campaigns deployment and OCI address

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deployment-verify.yml
      - .github/workflows/provision-campaigns.yml
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL || secrets.COOLIFY_URL || 'https://deploy.mkety.com' }}
      COOLIFY_API_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN || secrets.COOLIFY_TOKEN }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_EMAIL_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_EMAIL_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_EMAIL_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_EMAIL_REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_EMAIL_PRIVATE_KEY }}
    steps:
      - name: Inspect Coolify application and latest deployment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = (process.env.COOLIFY_URL || '').trim();
          let origin;
          try { origin = new URL(raw.includes('://') ? raw : 'https://' + (raw.startsWith('//') ? raw.slice(2) : raw)); }
          catch { throw new Error('Coolify URL is invalid.'); }
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.search || origin.hash || (origin.pathname !== '/' && origin.pathname !== '')) throw new Error('Coolify URL must be a safe HTTPS origin.');
          const token = process.env.COOLIFY_API_TOKEN || '';
          if (!token) throw new Error('Coolify API token is missing.');
          const api = origin.origin + '/api/v1';
          const get = async path => {
            const response = await fetch(api + path, { headers: { authorization: 'Bearer ' + token, accept: 'application/json' }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error('Coolify returned HTTP ' + response.status + ' for ' + path + '.');
            return response.json();
          };
          const apps = await get('/applications');
          const normalize = value => {
            let repo = String(value || '').toLowerCase();
            if (repo.startsWith('git@github.com:')) repo = 'github.com/' + repo.slice('git@github.com:'.length);
            if (repo.startsWith('https://')) repo = repo.slice('https://'.length);
            if (repo.startsWith('http://')) repo = repo.slice('http://'.length);
            if (repo.endsWith('.git')) repo = repo.slice(0, -4);
            if (repo.endsWith('/')) repo = repo.slice(0, -1);
            return repo;
          };
          const matches = apps.filter(a => normalize(a.git_repository) === 'github.com/mketydigital/mkety-campaigns' && a.git_branch === 'main' || a.name === 'mkety-campaigns' || String(a.domains || a.fqdn || '').includes('campaign.mkety.com'));
          if (matches.length !== 1) {
            console.log('Campaigns Coolify app matches:', matches.length);
            process.exit(0);
          }
          const app = await get('/applications/' + matches[0].uuid);
          console.log('Campaigns app metadata:', JSON.stringify({ name: app.name, uuid: app.uuid, domains: app.domains || app.fqdn, status: app.status, health_check_enabled: app.health_check_enabled, build_pack: app.build_pack, base_directory: app.base_directory, dockerfile_location: app.dockerfile_location, git_branch: app.git_branch, git_commit_sha: app.git_commit_sha }));
          const deployments = await get('/deployments/applications/' + app.uuid);
          const list = Array.isArray(deployments) ? deployments : (deployments.deployments || []);
          const recent = list.slice(0, 3).map(item => ({ status: item.status, created_at: item.created_at, deployment_uuid: item.deployment_uuid }));
          console.log('Recent deployment states:', JSON.stringify(recent));
          const failed = recent.find(item => item.status === 'failed' && item.deployment_uuid);
          if (failed) {
            const detail = await get('/deployments/' + failed.deployment_uuid);
            const logs = String(detail.logs || '');
            const categories = [];
            if (/ECONNREFUSED|connection refused|could not connect|ETIMEDOUT|connect timeout|ENOTFOUND|ECONNRESET/i.test(logs)) categories.push('database-or-service-connection');
            if (/28P01|password authentication failed|database authentication failed/i.test(logs)) categories.push('database-authentication');
            if (/3D000|database .{0,60} does not exist/i.test(logs)) categories.push('database-not-found');
            if (/42501|permission denied.{0,80}schema|insufficient privilege/i.test(logs)) categories.push('database-permissions');
            if (/migration.{0,100}(failed|error|exception)|(?:failed|error|exception).{0,100}migration/i.test(logs)) categories.push('migration-failure');
            if (/(BETTER_AUTH_SECRET|MKETY_OPS_AUTH_ISSUER|ZITADEL|OIDC).{0,100}(missing|invalid|required|must|error|failed|mismatch)/i.test(logs)) categories.push('authentication-configuration-failure');
            if (/failed to read Dockerfile|Dockerfile.{0,80}(not found|does not exist)|failed to send context/i.test(logs)) categories.push('dockerfile-or-build-context');
            if (/out of memory|oom.?killed|exit code 137/i.test(logs)) categories.push('build-memory-limit');
            if (/npm (?:ERR!|error) code E[A-Z0-9]+/i.test(logs)) categories.push('dependency-installation-failure');
            if (/error TS\d{4,5}/.test(logs)) categories.push('typescript-build-failure');
            if (/failed to solve|failed to build|npm (?:ERR!|error)|executor failed|error during (?:image )?build/i.test(logs)) categories.push('image-build-failure');
            if (/(health.?check|readyz).{0,100}(failed|unhealthy|timeout|error)|EADDRINUSE/i.test(logs)) categories.push('health-or-port-failure');
            if (categories.length === 0 && /\b(?:Error:|ERR_[A-Z]+|fatal exception)\b/i.test(logs)) categories.push('runtime-startup-error');
            if (categories.length === 0 && /error|failed|fatal|exception/i.test(logs)) categories.push('unclassified-deployment-error');
            const sqlstates = [...new Set([...logs.matchAll(/\bSQLSTATE\s*[:=]?\s*([0-9A-Z]{5})\b/g)].map(match => match[1]))];
            const knownNpmCodes = new Set(['EAI_AGAIN','ECONNREFUSED','ECONNRESET','EEXIST','EINTEGRITY','EINVAL','EISDIR','ENOENT','ENOTFOUND','EACCES','EPERM','E401','E403','E404','ETIMEDOUT','ERESOLVE','EBADENGINE']);
            const npmCodes = [...new Set([...logs.matchAll(/npm (?:ERR!|error) code ([A-Z0-9_]{3,16})/gi)].map(match => match[1].toUpperCase()).filter(code => knownNpmCodes.has(code)))];
            const typescriptCodes = [...new Set([...logs.matchAll(/error TS(\d{4,5})/g)].map(match => 'TS' + match[1]))];
            const unresolvedImports = [...new Set([...logs.matchAll(/\bTS2307\b[^\n]{0,240}?Cannot find module\s+['\"]([A-Za-z0-9@._/-]{1,180})['\"]/gi)].map(match => match[1]))];
            console.log('Deployment diagnostic categories:', JSON.stringify(categories));
            if (sqlstates.length) console.log('PostgreSQL SQLSTATE codes:', JSON.stringify(sqlstates));
            if (npmCodes.length) console.log('npm error codes:', JSON.stringify(npmCodes));
            if (typescriptCodes.length) console.log('TypeScript error codes:', JSON.stringify(typescriptCodes));
            if (unresolvedImports.length) console.log('TypeScript unresolved module specifiers:', JSON.stringify(unresolvedImports));
            if (categories.length === 0 && sqlstates.length === 0 && npmCodes.length === 0 && typescriptCodes.length === 0) console.log('Coolify deployment logs contained no recognized diagnostic pattern.');
          }
          NODE

      - name: Resolve manual DNS target through read-only OCI compute inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet oci
          python - <<'PY'
          import json, os
          stage = "SDK import"
          try:
              import oci
              stage = "signing key parse"
              cfg = {
                  "user": os.environ["OCI_USER_OCID"],
                  "fingerprint": os.environ["OCI_FINGERPRINT"],
                  "tenancy": os.environ["OCI_TENANCY_OCID"],
                  "region": os.environ["OCI_REGION"],
                  "key_content": os.environ["OCI_PRIVATE_KEY"],
              }
              oci.signer.load_private_key(cfg["key_content"], None)
              stage = "compute-client-construction"
              compute = oci.core.ComputeClient(cfg)
              network = oci.core.VirtualNetworkClient(cfg)
              stage = "instance-list-request"
              instances = oci.pagination.list_call_get_all_results(
                  compute.list_instances,
                  compartment_id=cfg["tenancy"],
                  compartment_id_in_subtree=True,
                  lifecycle_state="RUNNING",
              ).data
              addresses = []
              stage = "VNIC-attachment-list"
              for instance in instances:
                  stage = "VNIC-attachment-list"
                  attachments = oci.pagination.list_call_get_all_results(
                      compute.list_vnic_attachments,
                      compartment_id=instance.compartment_id,
                      instance_id=instance.id,
                  ).data
                  for attachment in attachments:
                      if not attachment.vnic_id:
                          continue
                      stage = "VNIC-detail-request"
                      vnic = network.get_vnic(attachment.vnic_id).data
                      if vnic.public_ip:
                          addresses.append({"instance": instance.display_name, "public_ipv4": vnic.public_ip})
              if addresses:
                  print("OCI public IPv4 DNS candidates (confirm which instance is the Coolify host before adding DNS):", json.dumps(addresses))
              else:
                  print("OCI compute inventory returned no public IPv4 DNS candidates for running instances.")
          except Exception as exc:
              code = getattr(exc, "status", None) or getattr(exc, "code", None) or type(exc).__name__
              print("OCI compute address lookup unavailable at " + stage + "; permission/network/status:", str(code))
          PY
