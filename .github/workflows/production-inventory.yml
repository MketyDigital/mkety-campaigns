name: Campaigns production inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-inventory.yml

permissions:
  contents: read

concurrency:
  group: mkety-campaigns-production-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL || secrets.COOLIFY_URL || 'https://deploy.mkety.com' }}
      COOLIFY_API_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN || secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CF_TOKEN || secrets.MKETY_CLOUDFLARE_API_TOKEN }}
      ZITADEL_URL: ${{ secrets.ZITADEL_URL || vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_PAT: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.MKETY_DATABASE_URL || secrets.CAMPAIGNS_DATABASE_URL || secrets.OCI_DATABASE_URL || secrets.POSTGRES_URL }}
      CAMPAIGNS_DB_SCHEMA: campaigns
      MKETY_OPS_AUTH_CLIENT_ID: ${{ secrets.MKETY_OPS_AUTH_CLIENT_ID }}
      MKETY_OPS_AUTH_ISSUER: ${{ vars.MKETY_OPS_AUTH_ISSUER || 'https://mkety-dzb0ve.eu1.zitadel.cloud' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.AUTH_SECRET }}
      ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
      OCI_EMAIL_PRIVATE_KEY: ${{ secrets.OCI_EMAIL_PRIVATE_KEY }}
      OCI_EMAIL_TENANCY_OCID: ${{ secrets.OCI_EMAIL_TENANCY_OCID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.MKETY_CF_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.MKETY_CF_R2_ACCESS || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.MKETY_CF_R2_TOKEN || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.MKETY_CF_R2_ENDPOINT }}
      AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
      OCI_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OCI_OBJECT_STORAGE_ACCESS_KEY_ID }}
      OCI_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OCI_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies for read-only database checks
        run: npm ci

      - name: Report required secret availability
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const vars = [
            'COOLIFY_API_TOKEN','CLOUDFLARE_API_TOKEN','ZITADEL_URL','ZITADEL_MANAGEMENT_PAT',
            'ZITADEL_PROJECT_ID','DATABASE_URL','CAMPAIGNS_DB_SCHEMA','BETTER_AUTH_SECRET','MKETY_OPS_AUTH_CLIENT_ID','MKETY_OPS_AUTH_ISSUER',
            'ACS_EMAIL_CONNECTION_STRING','OCI_EMAIL_PRIVATE_KEY','OCI_EMAIL_TENANCY_OCID',
            'R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ENDPOINT','AZURE_STORAGE_CONNECTION_STRING','AZURE_STORAGE_CONTAINER',
            'OCI_OBJECT_STORAGE_ACCESS_KEY_ID','OCI_OBJECT_STORAGE_SECRET_ACCESS_KEY'
          ];
          for (const key of vars) console.log(key + ': ' + (process.env[key] ? 'present' : 'missing'));
          const out = process.env.GITHUB_STEP_SUMMARY;
          require('fs').appendFileSync(out, '## Campaigns credential inventory\n\n' + vars.map(key => '- ' + key + ': ' + (process.env[key] ? 'present' : 'missing')).join('\n') + '\n');
          NODE

      - name: Inspect Coolify without changing resources
        if: env.COOLIFY_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          case "$COOLIFY_URL" in https://*) ;; http://*) echo "Coolify URL uses HTTP; inventory stopped without sending a token." >&2; exit 1 ;; *) COOLIFY_URL="https://${COOLIFY_URL#//}" ;; esac
          api="${COOLIFY_URL%/}/api/v1"
          headers=(--header "Authorization: Bearer $COOLIFY_API_TOKEN" --header "Accept: application/json")
          for resource in applications projects servers databases services; do
            if ! curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/$resource" > "$RUNNER_TEMP/coolify-$resource.json"; then
              echo "Coolify $resource inventory failed (no changes made)."
              exit 1
            fi
          done
          for app_uuid in $(node - "$RUNNER_TEMP/coolify-applications.json" <<'NODE'
          const fs=require('fs'),apps=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const a of apps) if(/assist|auth/i.test([a.name,a.fqdn,a.domains].join(' '))&&a.uuid) console.log(a.uuid);
          NODE
          ); do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/applications/$app_uuid/envs" > "$RUNNER_TEMP/coolify-envs-$app_uuid.json"
          done
          for service_uuid in $(node - "$RUNNER_TEMP/coolify-services.json" <<'NODE'
          const fs=require('fs'),items=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const s of items) if(/zitadel|auth|assist/i.test([s.name,s.fqdn,s.domains].join(' '))&&s.uuid) console.log(s.uuid);
          NODE
          ); do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/services/$service_uuid/envs" > "$RUNNER_TEMP/coolify-service-envs-$service_uuid.json"
          done
          for database_uuid in $(node - "$RUNNER_TEMP/coolify-databases.json" <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const item of d) if(item.uuid) console.log(item.uuid);
          NODE
          ); do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/databases/$database_uuid/envs" > "$RUNNER_TEMP/coolify-database-envs-$database_uuid.json"
          done
          for database_uuid in $(node - "$RUNNER_TEMP/coolify-databases.json" <<'NODE'
          const fs=require('fs'),items=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const d of items) if(d.uuid) console.log(d.uuid);
          NODE
          ); do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/databases/$database_uuid" > "$RUNNER_TEMP/coolify-database-detail-$database_uuid.json"
          done
          for project_uuid in $(node - "$RUNNER_TEMP/coolify-projects.json" <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const p of d) if(p.uuid) console.log(p.uuid);
          NODE
          ); do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/projects/$project_uuid/environments" > "$RUNNER_TEMP/coolify-environments-$project_uuid.json"
          done
          node - "$RUNNER_TEMP" <<'NODE'
          const fs=require('fs'), path=require('path'), dir=process.argv[2];
          const read=name=>JSON.parse(fs.readFileSync(path.join(dir,'coolify-'+name+'.json'),'utf8'));
          const apps=read('applications'), projects=read('projects'), servers=read('servers'), databases=read('databases'), services=read('services');
          const environmentsByProject=new Map();
          for(const name of fs.readdirSync(dir).filter(n=>n.startsWith('coolify-environments-'))){
            const projectUuid=name.slice('coolify-environments-'.length,-5);
            const items=JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));
            environmentsByProject.set(projectUuid,items.map(e=>({name:e.name,uuid:e.uuid})));
          }
          const related=apps.filter(a=>String(a.git_repository||'').toLowerCase().includes('mkety-campaigns')||/campaign/i.test(a.name||''));
          const identityApps=apps.filter(a=>/assist|auth/i.test([a.name,a.fqdn,a.domains].join(' ')));
          console.log('Coolify applications:',apps.length,'; Campaigns candidates:',related.length,'; Assist/Auth candidates:',identityApps.length);
          for(const a of identityApps) console.log('Identity app:',JSON.stringify({name:a.name,uuid:a.uuid,domains:a.domains||a.fqdn}));
          for(const a of related) console.log(JSON.stringify({name:a.name,repository:a.git_repository,branch:a.git_branch,uuid:a.uuid,domains:a.domains||a.fqdn}));
          for(const a of identityApps){
            const target=path.join(dir,'coolify-envs-'+a.uuid+'.json');
            const envs=JSON.parse(fs.readFileSync(target,'utf8'));
            const rows=Array.isArray(envs)?envs:(envs.data||envs.envs||[]);
            console.log('Identity environment keys:',JSON.stringify({app:a.name,keys:rows.map(e=>e.key).filter(Boolean)}));
          }
          console.log('Coolify projects:',projects.length);
          for(const p of projects) console.log(JSON.stringify({name:p.name,uuid:p.uuid,environments:environmentsByProject.get(p.uuid)||[]}));
          const identityServices=services.filter(s=>/zitadel|auth|assist/i.test([s.name,s.fqdn,s.domains].join(' ')));
          console.log('Coolify matching identity services:',identityServices.length);
          for(const s of identityServices){
            console.log('Identity service:',JSON.stringify({name:s.name,uuid:s.uuid,domains:s.domains||s.fqdn,status:s.status}));
            const envs=JSON.parse(fs.readFileSync(path.join(dir,'coolify-service-envs-'+s.uuid+'.json'),'utf8'));
            const rows=Array.isArray(envs)?envs:(envs.data||envs.envs||[]);
            console.log('Identity service environment keys:',JSON.stringify({service:s.name,keys:rows.map(e=>e.key).filter(Boolean)}));
          }
          console.log('Coolify databases:',databases.length);
          for(const d of databases){
            const target=path.join(dir,'coolify-database-envs-'+d.uuid+'.json');
            const envs=JSON.parse(fs.readFileSync(target,'utf8'));
            const rows=Array.isArray(envs)?envs:(envs.data||envs.envs||[]);
            const names=rows.map(e=>e.key).filter(Boolean);
            const defaultDb=rows.find(e=>e.key==='POSTGRES_DB');
            const details=JSON.parse(fs.readFileSync(path.join(dir,'coolify-database-detail-'+d.uuid+'.json'),'utf8'));
            console.log('Database configuration keys:',JSON.stringify({name:d.name,uuid:d.uuid,status:d.status,keys:names,configuredDefaultDatabase:defaultDb?.value||defaultDb?.real_value||undefined,detailKeys:Object.keys(details)}));
          }
          console.log('Coolify servers:',servers.length);
          for(const s of servers) console.log(JSON.stringify({name:s.name,uuid:s.uuid,ip:s.ip,status:s.settings?.is_reachable===false?'unreachable':'reported'}));
          const sum=process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(sum,'\n## Coolify inventory\n\n- Applications: '+apps.length+'\n- Campaigns candidates: '+related.length+'\n- Projects: '+projects.length+'\n- Servers: '+servers.length+'\n');
          NODE

      - name: Inspect Cloudflare zone and campaign DNS without changing records
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          headers=(--header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Accept: application/json")
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "https://api.cloudflare.com/client/v4/zones?name=mkety.com" > "$RUNNER_TEMP/cf-zones.json"
          node - "$RUNNER_TEMP/cf-zones.json" > "$RUNNER_TEMP/cf-zone-id" <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!data.success) throw new Error('Cloudflare zone lookup was not successful');
          const zones=(data.result||[]).filter(z=>z.name==='mkety.com');
          if(zones.length!==1){console.error('Cloudflare zone candidates for mkety.com:',zones.length);process.exit(0)}
          process.stdout.write(zones[0].id);
          NODE
          zone_id="$(tr -d '\r\n' < "$RUNNER_TEMP/cf-zone-id")"
          if [ -z "$zone_id" ]; then echo "Cloudflare mkety.com zone is not uniquely available."; exit 0; fi
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=campaign.mkety.com" > "$RUNNER_TEMP/cf-records.json"
          node - "$RUNNER_TEMP/cf-records.json" <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!data.success) throw new Error('Cloudflare DNS lookup was not successful');
          console.log('Cloudflare campaign.mkety.com records:',(data.result||[]).map(r=>({type:r.type,name:r.name,content:r.content,proxied:r.proxied})));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Cloudflare DNS inventory\n\n- campaign.mkety.com records: '+(data.result||[]).length+'\n');
          NODE

      - name: Check MKETY Auth issuer and application inventory access
        if: env.ZITADEL_URL != '' && env.ZITADEL_MANAGEMENT_PAT != '' && env.ZITADEL_PROJECT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          ZITADEL_URL="$ZITADEL_URL" ZITADEL_MANAGEMENT_PAT="$ZITADEL_MANAGEMENT_PAT" ZITADEL_PROJECT_ID="$ZITADEL_PROJECT_ID" node --input-type=module - <<'NODE'
          const issuer=process.env.ZITADEL_URL.replace(/\/+$/,'');
          const token=process.env.ZITADEL_MANAGEMENT_PAT;
          const discovery=await fetch(issuer+'/.well-known/openid-configuration',{redirect:'error'});
          if(!discovery.ok) throw new Error('MKETY Auth discovery endpoint did not respond successfully');
          const config=await discovery.json();
          if(config.issuer.replace(/\/+$/,'')!==issuer) throw new Error('MKETY Auth discovery issuer does not match configuration');
          const response=await fetch(issuer+'/zitadel.application.v2.ApplicationService/ListApplications',{
            method:'POST',
            headers:{authorization:'Bearer '+token,'connect-protocol-version':'1','content-type':'application/json'},
            body:JSON.stringify({})
          });
          if(!response.ok) throw new Error('MKETY Auth application inventory failed with HTTP '+response.status);
          const data=await response.json();
          const matches=(data.applications||[]).filter(a=>a.projectId===process.env.ZITADEL_PROJECT_ID && a.name==='Mkety Campaigns Ops Production');
          console.log('MKETY Auth issuer verified; project applications visible:',(data.applications||[]).filter(a=>a.projectId===process.env.ZITADEL_PROJECT_ID).length,'; Campaigns Ops app matches:',matches.length);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## MKETY Auth inventory\n\n- OIDC issuer: reachable and verified\n- Campaigns Ops app matches: '+matches.length+'\n');
          NODE

      - name: Report the configured MKETY database target without connecting
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url=new URL(process.env.DATABASE_URL);
          if(!['postgres:','postgresql:'].includes(url.protocol)){
            console.error('MKETY_DATABASE_URL is not a PostgreSQL URL; database name, host, and credentials were not printed.');
            process.exit(1);
          }
          const database=decodeURIComponent(url.pathname.slice(1));
          console.log('Configured PostgreSQL database name:',database);
          console.log(database==='mkety'
            ? 'Existing connection targets the shared mkety database; Campaigns production tables are configured for isolated schema campaigns.'
            : 'Existing connection does not target the expected mkety database. No app migrations were run.');
          NODE

      - name: Check shared Postgres connectivity and database creation permission
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import pg from 'pg';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:7000,max:1});
          try{
            const result=await pool.query("SELECT current_database() AS database, has_database_privilege(current_user,current_database(),'CREATE') AS can_create_schema, EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='campaigns') AS campaigns_schema_exists, CASE WHEN EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='campaigns') THEN has_schema_privilege(current_user,'campaigns','USAGE') AND has_schema_privilege(current_user,'campaigns','CREATE') ELSE has_database_privilege(current_user,current_database(),'CREATE') END AS can_migrate_campaigns");
            const row=result.rows[0];
            console.log('MKETY PostgreSQL connection: successful');
            console.log('Campaigns schema readiness:',JSON.stringify({connectedToMketyDatabase:row.database==='mkety',schemaExists:row.campaigns_schema_exists===true,roleCanCreateSchema:row.can_create_schema===true,roleCanMigrateCampaigns:row.can_migrate_campaigns===true}));
          }catch(error){
            console.log('MKETY PostgreSQL connection: not reachable from the GitHub runner; SQLSTATE:',error?.code||'unavailable');
          }finally{
            await pool.end();
          }
          NODE

      - name: Resolve the existing Coolify host for manual DNS setup
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { lookup } from 'node:dns/promises';
          try {
            const answers=await lookup('deploy.mkety.com',{all:true,verbatim:true});
            console.log('deploy.mkety.com public DNS addresses:',JSON.stringify(answers));
          } catch {
            console.log('deploy.mkety.com did not resolve from the GitHub runner.');
          }
          NODE

      - name: Check MKETY Auth discovery and service-user read access
        if: env.COOLIFY_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir=process.env.RUNNER_TEMP;
          const apps=JSON.parse(fs.readFileSync(path.join(dir,'coolify-applications.json'),'utf8'));
          const app=apps.find(a=>/zitadel|auth/i.test([a.name,a.fqdn,a.domains].join(' ')));
          if(!app){console.log('MKETY Auth Coolify app: not found');process.exit(0)}
          const envSource=JSON.parse(fs.readFileSync(path.join(dir,'coolify-envs-'+app.uuid+'.json'),'utf8'));
          const envs=Array.isArray(envSource)?envSource:(envSource.data||envSource.envs||[]);
          const unquote=value=>{
            let text=String(value||'').trim();
            if((text.startsWith("'")&&text.endsWith("'"))||(text.startsWith('"')&&text.endsWith('"')))text=text.slice(1,-1).trim();
            return text;
          };
          const get=k=>unquote(envs.filter(e=>e.key===k).map(e=>e.real_value||e.value||'').find(v=>typeof v==='string'&&v.length>0)||'');
          const trim=value=>{while(value.endsWith('/'))value=value.slice(0,-1);return value};
          const normalize=raw=>{
            if(!raw)return null;
            try{const u=new URL(raw.includes('://')?raw:'https://'+raw);if(u.protocol!=='https:')return null;u.username='';u.password='';u.search='';u.hash='';return trim(u.toString())}
            catch{return null}
          };
          const bases=[app.domains||app.fqdn,get('ZITADEL_PUBLIC_HOST'),get('ZITADEL_INSTANCE_HOST'),get('ZITADEL_API_URL')].map(normalize).filter(Boolean);
          const unique=[...new Set(bases)];
          for(const candidate of unique){
            const safe=new URL(candidate);
            console.log('MKETY Auth endpoint candidate:',JSON.stringify({host:safe.host,path:safe.pathname}));
          }
          let issuer='';
          for(const base of unique){
            for(const suffix of ['/.well-known/openid-configuration','/oauth/v2/.well-known/openid-configuration']){
              try{
                const response=await fetch(base+suffix,{redirect:'error',signal:AbortSignal.timeout(8000)});
                if(!response.ok)continue;
                const data=await response.json();
                if(typeof data.issuer==='string'){issuer=trim(data.issuer);break}
              }catch{}
            }
            if(issuer)break;
          }
          if(issuer)console.log('MKETY Auth OIDC discovery: verified for issuer host',new URL(issuer).host);
          else console.log('MKETY Auth OIDC discovery: no standard endpoint found at inspected HTTPS candidates');
          const token=get('ZITADEL_SERVICE_USER_TOKEN');
          if(!token){console.log('MKETY Auth service-user token: absent from Coolify app configuration');process.exit(0)}
          const apiBases=[...unique];
          if(issuer)apiBases.unshift(issuer);
          let listed=false;
          for(const base of [...new Set(apiBases)]){
            try{
              const response=await fetch(base+'/zitadel.application.v2.ApplicationService/ListApplications',{
                method:'POST',redirect:'error',signal:AbortSignal.timeout(8000),
                headers:{authorization:'Bearer '+token,'connect-protocol-version':'1','content-type':'application/json'},
                body:'{}'
              });
              if(!response.ok)continue;
              const data=await response.json();
              console.log('MKETY Auth service-user application read: successful; visible application count:',(data.applications||[]).length);
              listed=true;break;
            }catch{}
          }
          if(!listed)console.log('MKETY Auth service-user application read: not reachable or not authorized from the GitHub runner');
          NODE
