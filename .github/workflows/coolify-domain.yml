name: Configure Campaigns Coolify domain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coolify-domain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkety-campaigns-coolify-domain
  cancel-in-progress: false

jobs:
  configure-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL || secrets.COOLIFY_URL || 'https://deploy.mkety.com' }}
      COOLIFY_API_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN || secrets.COOLIFY_TOKEN }}
      APP_REPOSITORY: MketyDigital/mkety-campaigns
      APP_BRANCH: main
      CAMPAIGNS_DOMAIN: https://campaign.mkety.com
      ENABLE_OWNER_TEST_SEND: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[owner-test-send]') }}
    steps:
      - name: Configure app domain and redeploy
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_API_TOKEN:?Set OCI_COOLIFY_TOKEN or COOLIFY_TOKEN in repository secrets}"
          case "$COOLIFY_URL" in
            https://*) ;;
            http://*) echo "COOLIFY_URL must use HTTPS; refusing to send the API token over HTTP." >&2; exit 1 ;;
            *) COOLIFY_URL="https://${COOLIFY_URL#//}" ;;
          esac
          case "$COOLIFY_URL" in
            https://?*) ;;
            *) echo "COOLIFY_URL must use HTTPS." >&2; exit 1 ;;
          esac

          api="${COOLIFY_URL%/}/api/v1"
          headers=(--header "Authorization: Bearer $COOLIFY_API_TOKEN" --header "Accept: application/json")
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/applications" > "$RUNNER_TEMP/coolify-apps.json"

          app_uuid="$(node --input-type=module - "$RUNNER_TEMP/coolify-apps.json" "$APP_REPOSITORY" "$APP_BRANCH" <<'NODE'
          import fs from 'node:fs';
          const [file, repository, branch] = process.argv.slice(2);
          const normalize = (value = '') => value.toLowerCase().replace(/^https?:\/\//, '').replace(/^git@github\.com:/, '').replace(/^github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
          const wanted = normalize(repository);
          const apps = JSON.parse(fs.readFileSync(file, 'utf8'));
          const matches = apps.filter(app => normalize(app.git_repository) === wanted && app.git_branch === branch);
          if (matches.length !== 1 || !matches[0].uuid) {
            console.error(`Expected one Coolify app for ${repository} on ${branch}; found ${matches.length}. No changes made.`);
            const related = apps.filter(app =>
              normalize(app.git_repository).includes('mkety-campaigns') || /campaign/i.test(app.name ?? '')
            );
            if (related.length) {
              console.error('Related Coolify app metadata:', JSON.stringify(related.map(({ name, git_repository, git_branch }) => ({
                name, git_repository, git_branch
              }))));
            } else {
              console.error(`Coolify returned ${apps.length} applications; none have Campaigns in the app name or repository URL.`);
            }
            process.exit(1);
          }
          process.stdout.write(matches[0].uuid);
          NODE
          )"
          echo "::add-mask::$app_uuid"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" "$api/applications/$app_uuid" > "$RUNNER_TEMP/coolify-app.json"
          node --input-type=module - "$RUNNER_TEMP/coolify-app.json" "$RUNNER_TEMP/coolify-domain.json" "$CAMPAIGNS_DOMAIN" <<'NODE'
          import fs from 'node:fs';
          const [source, destination, domain] = process.argv.slice(2);
          const app = JSON.parse(fs.readFileSync(source, 'utf8'));
          const existing = app.domains ?? app.fqdn ?? '';
          const domains = (Array.isArray(existing) ? existing : String(existing).split(','))
            .map(value => value.trim()).filter(Boolean);
          const normalized = domain.replace(/\/$/, '').toLowerCase();
          if (!domains.some(value => value.replace(/\/$/, '').toLowerCase() === normalized)) domains.push(domain);
          fs.writeFileSync(destination, JSON.stringify({ domains: domains.join(',') }));
          NODE

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --request PATCH "${headers[@]}" --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/coolify-domain.json" "$api/applications/$app_uuid" \
            > "$RUNNER_TEMP/coolify-domain-update.json"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" \
            "$api/applications/$app_uuid/envs" > "$RUNNER_TEMP/coolify-envs.json"

          if [ "$ENABLE_OWNER_TEST_SEND" = "true" ]; then
            node --input-type=module - "$RUNNER_TEMP/coolify-envs.json" <<'NODE'
          import fs from 'node:fs';
          const envs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const entries = new Map();
          for (const entry of envs) {
            if (!entry || typeof entry.key !== 'string') continue;
            const existing = entries.get(entry.key) ?? [];
            existing.push(entry);
            entries.set(entry.key, existing);
          }
          const get = (key) => {
            const values = entries.get(key) ?? [];
            if (values.length > 1) throw new Error(`Duplicate Coolify environment entries: ${key}`);
            return values[0];
          };
          const configured = (key) => {
            const entry = get(key);
            return Boolean(entry && (
              (typeof entry.value === 'string' && entry.value.trim().length > 0) ||
              entry.is_shown_once === true ||
              entry.is_secret === true
            ));
          };
          const provider = get('EMAIL_PROVIDER')?.value?.trim() || 'acs-email';
          const providerKeys = provider === 'acs-email'
            ? ['ACS_EMAIL_CONNECTION_STRING']
            : provider === 'oci-email-delivery'
              ? ['OCI_EMAIL_ENDPOINT', 'OCI_EMAIL_REGION', 'OCI_EMAIL_TENANCY_OCID', 'OCI_EMAIL_USER_OCID', 'OCI_EMAIL_FINGERPRINT', 'OCI_EMAIL_PRIVATE_KEY', 'OCI_EMAIL_COMPARTMENT_OCID']
              : null;
          if (!providerKeys) throw new Error('EMAIL_PROVIDER must be acs-email or oci-email-delivery');
          const domainKeys = provider === 'acs-email'
            ? ['AZURE_ARM_TENANT_ID', 'AZURE_ARM_CLIENT_ID', 'AZURE_ARM_CLIENT_SECRET', 'AZURE_SUBSCRIPTION_ID', 'AZURE_RESOURCE_GROUP', 'AZURE_EMAIL_SERVICE_NAME', 'AZURE_COMMUNICATION_SERVICE_NAME']
            : ['OCI_EMAIL_REGION', 'OCI_EMAIL_TENANCY_OCID', 'OCI_EMAIL_USER_OCID', 'OCI_EMAIL_FINGERPRINT', 'OCI_EMAIL_PRIVATE_KEY', 'OCI_EMAIL_COMPARTMENT_OCID'];
          const required = ['DATABASE_URL', 'BETTER_AUTH_SECRET', 'BETTER_AUTH_URL', ...providerKeys, ...domainKeys];
          const missing = [...new Set(required)].filter((key) => !configured(key));
          if (missing.length) throw new Error(`Test-send preflight is blocked: missing configured runtime entries (${missing.join(', ')}). No send flags were changed.`);
          const authUrl = get('BETTER_AUTH_URL')?.value?.trim().replace(/\/$/, '');
          if (authUrl !== 'https://campaign.mkety.com') throw new Error('BETTER_AUTH_URL must be https://campaign.mkety.com before enabling the test sender.');
          process.stdout.write(`Test-send preflight passed for ${provider}; credential values were not read into logs.\n`);
          NODE

            upsert_runtime_env() {
              local key="$1"
              local value="$2"
              local method
              method="$(node --input-type=module - "$RUNNER_TEMP/coolify-envs.json" "$key" <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).filter((entry) => entry.key === process.argv[3]);
          if (entries.length > 1) { console.error(`Duplicate Coolify environment entries: ${process.argv[3]}`); process.exit(1); }
          process.stdout.write(entries.length ? 'PATCH' : 'POST');
          NODE
              )"
              local payload
              payload="$(node --input-type=module - "$key" "$value" <<'NODE'
          const [key, value] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({ key, value, is_literal: true, is_runtime: true, is_buildtime: false, is_preview: false }));
          NODE
              )"
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                --request "$method" "${headers[@]}" --header 'Content-Type: application/json' \
                --data-binary "$payload" "$api/applications/$app_uuid/envs" > /dev/null
            }

            upsert_runtime_env EMAIL_CAMPAIGN_SEND_ENABLED false
            upsert_runtime_env SMS_ENABLED false
            upsert_runtime_env OCI_BACKUP_ENABLED false
            upsert_runtime_env EMAIL_TEST_SEND_ENABLED true

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error "${headers[@]}" \
              "$api/applications/$app_uuid/envs" > "$RUNNER_TEMP/coolify-envs-verified.json"
            node --input-type=module - "$RUNNER_TEMP/coolify-envs-verified.json" <<'NODE'
          import fs from 'node:fs';
          const envs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = new Map([
            ['EMAIL_TEST_SEND_ENABLED', 'true'],
            ['EMAIL_CAMPAIGN_SEND_ENABLED', 'false'],
            ['SMS_ENABLED', 'false'],
            ['OCI_BACKUP_ENABLED', 'false'],
          ]);
          for (const [key, value] of expected) {
            const entries = envs.filter((entry) => entry.key === key);
            if (entries.length !== 1 || String(entries[0].value).trim().toLowerCase() !== value) {
              throw new Error(`Coolify did not confirm the expected safe gate for ${key}`);
            }
          }
          process.stdout.write('Verified owner-only test send on; campaign sending, SMS, and OCI backup off.\n');
          NODE
          fi
          env_uuid="$(node --input-type=module - "$RUNNER_TEMP/coolify-envs.json" <<'NODE'
          import fs from 'node:fs';
          const envs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const matches = envs.filter(value => value.key === 'BETTER_AUTH_URL');
          if (matches.length > 1) { console.error('Coolify has duplicate BETTER_AUTH_URL entries.'); process.exit(1); }
          process.stdout.write(matches[0]?.uuid ?? '');
          NODE
          )"
          if [ -n "$env_uuid" ]; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --request PATCH "${headers[@]}" --header 'Content-Type: application/json' \
              --data '{"key":"BETTER_AUTH_URL","value":"https://campaign.mkety.com","is_literal":true,"is_runtime":true,"is_buildtime":false}' \
              "$api/applications/$app_uuid/envs" > "$RUNNER_TEMP/coolify-env-update.json"
          else
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --request POST "${headers[@]}" --header 'Content-Type: application/json' \
              --data '{"key":"BETTER_AUTH_URL","value":"https://campaign.mkety.com","is_literal":true,"is_runtime":true,"is_buildtime":false,"is_preview":false}' \
              "$api/applications/$app_uuid/envs" > "$RUNNER_TEMP/coolify-env-create.json"
          fi

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --request POST "${headers[@]}" "$api/applications/$app_uuid/start?instant_deploy=true" \
            > "$RUNNER_TEMP/coolify-deploy.json"
          healthy=false
          for attempt in $(seq 1 30); do
            health_code="$(curl --fail --silent --output /dev/null --write-out "%{http_code}" "$CAMPAIGNS_DOMAIN/healthz" || true)"
            ready_code="$(curl --fail --silent --output /dev/null --write-out "%{http_code}" "$CAMPAIGNS_DOMAIN/readyz" || true)"
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then healthy=true; break; fi
            sleep 10
          done
          if [ "$healthy" != "true" ]; then
            echo "Deployment was requested, but /healthz and /readyz did not both return HTTP 200." >&2
            exit 1
          fi
          echo "Coolify deployment is healthy; /healthz and /readyz returned HTTP 200."
